<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us — Start Your AI or SaaS Project | Softika</title>
    <meta
      name="description"
      content="Get in touch with Softika to discuss your next AI agent, SaaS platform, or cloud-native project. Based in Vienna, working globally."
    />
    <link rel="canonical" href="https://www.softika.dev/contact/" />
    <meta property="og:title" content="Contact Us | Softika" />
    <meta
      property="og:description"
      content="Get in touch to discuss your next AI agent, SaaS platform, or cloud-native project."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.softika.dev/contact/" />
    <meta property="og:site_name" content="Softika" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Contact Softika" />
    <meta
      name="twitter:description"
      content="Start your next AI or SaaS project with senior engineers from Vienna."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body data-page="contact">
    <div class="site">
      <header class="site-header">
        <div class="container header-inner">
          <a class="logo-link" href="/" aria-label="Softika home">
            <img src="/assets/imgs/black_logo_transparent.svg" alt="softika logo symbol" />
          </a>

          <nav class="desktop-nav" aria-label="Main navigation">
            <a class="nav-link" data-nav-link href="/">Home</a>
            <a class="nav-link" data-nav-link href="/team/">Team</a>
            <a class="nav-link" data-nav-link href="/contact/">Contact</a>
          </nav>

          <button class="mobile-menu-btn" data-mobile-toggle type="button" aria-expanded="false" aria-label="Open navigation">
            <span class="icon-slot" data-icon="menu" data-size="30"></span>
          </button>
        </div>

        <nav class="mobile-nav" data-mobile-nav hidden aria-label="Mobile navigation">
          <ul class="mobile-nav-list">
            <li>
              <a class="mobile-nav-link" data-nav-link href="/">
                <span class="icon-slot" data-icon="home-outline" data-size="20"></span>
                Home
              </a>
            </li>
            <li>
              <a class="mobile-nav-link" data-nav-link href="/team/">
                <span class="icon-slot" data-icon="account-multiple-outline" data-size="20"></span>
                Team
              </a>
            </li>
            <li>
              <a class="mobile-nav-link" data-nav-link href="/contact/">
                <span class="icon-slot" data-icon="email-outline" data-size="20"></span>
                Contact
              </a>
            </li>
          </ul>
        </nav>
      </header>

      <main class="site-main">
        <div class="container">
          <section class="section">
            <div class="banner banner-shell">
              <div class="banner-bg banner-bg-var4-main"></div>
              <div class="banner-bg banner-bg-var4-accent"></div>
              <div class="banner-panel">
                <h1 class="banner-title">Do you have an upcoming project?</h1>
                <p class="banner-text">We&apos;d love to work with you. Send us a message.</p>
              </div>
            </div>
          </section>

          <section class="section section-tight">
            <div class="form-card">
              <form id="contact-form" class="contact-form" novalidate>
                <div class="form-grid two-col">
                  <label class="field">
                    <input
                      id="contact-name"
                      class="form-input"
                      name="name"
                      type="text"
                      maxlength="99"
                      autocomplete="name"
                      placeholder="Your Name"
                    />
                    <p class="field-error" data-error-for="name"></p>
                  </label>

                  <label class="field">
                    <input
                      id="contact-email"
                      class="form-input"
                      name="email"
                      type="email"
                      autocomplete="email"
                      placeholder="Your Email"
                    />
                    <p class="field-error" data-error-for="email"></p>
                  </label>

                  <label class="field full">
                    <input
                      id="contact-subject"
                      class="form-input"
                      name="subject"
                      type="text"
                      maxlength="99"
                      placeholder="Subject"
                    />
                    <p class="field-error" data-error-for="subject"></p>
                  </label>

                  <label class="field full">
                    <textarea
                      id="contact-text"
                      class="form-textarea"
                      name="text"
                      rows="8"
                      placeholder="Your Message"
                    ></textarea>
                    <p class="field-error" data-error-for="text"></p>
                  </label>
                </div>

                <div class="form-grid two-col checkbox-row">
                  <label class="checkbox-item wiggle-wiggle">
                    <input id="robot-check" type="checkbox" />
                    I&apos;m not a robot!
                  </label>

                  <label class="checkbox-item">
                    <input id="policy-check" type="checkbox" />
                    I agree with
                    <a href="/policy/" target="_blank" rel="noopener noreferrer" title="Opens in new tab">Privacy Policy</a>
                  </label>
                </div>

                <div class="form-grid two-col button-row">
                  <button id="send-button" class="btn btn-secondary" type="submit">Send</button>
                  <button id="clear-button" class="btn btn-outline" type="button">Clear</button>
                </div>
              </form>

              <div id="contact-status" class="snackbar" hidden aria-live="polite">
                <span id="contact-status-icon" class="icon-slot"></span>
                <div class="snackbar-copy">
                  <span id="contact-status-title"></span>
                  <span id="contact-status-detail"></span>
                </div>
              </div>
            </div>
          </section>

          <section class="section">
            <div class="banner banner-only banner-shell">
              <div class="banner-bg banner-bg-var1-main"></div>
              <div class="banner-bg banner-bg-var1-accent"></div>
            </div>
          </section>
        </div>
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <a class="footer-logo" href="/" aria-label="Softika home">
            <img src="/assets/imgs/black_logo_transparent.svg" alt="softika logo symbol" />
          </a>

          <nav class="footer-links" aria-label="Footer links">
            <a class="footer-link" href="/">Home</a>
            <a class="footer-link" href="/contact/">Contact</a>
            <a class="footer-link" href="/team/">Team</a>
            <a class="footer-link" href="/policy/">Privacy Policy</a>
            <a class="footer-link" href="/imprint/">Imprint</a>
          </nav>

          <div class="footer-social">
            <a class="social-link" href="https://www.linkedin.com/company/softika" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
              <span class="icon-slot" data-icon="linkedin" data-size="24"></span>
            </a>
            <a class="social-link" href="https://www.instagram.com/softika.dev/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <span class="icon-slot" data-icon="instagram" data-size="24"></span>
            </a>
            <a class="social-link" href="https://twitter.com/SoftikaDev" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
              <span class="icon-slot" data-icon="twitter" data-size="24"></span>
            </a>
            <a class="social-link" href="https://www.facebook.com/profile.php?id=61555499463949" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
              <span class="icon-slot" data-icon="facebook" data-size="24"></span>
            </a>
          </div>

          <p class="footer-copy">All rights reserved &copy; <span data-current-year></span>, Softika Team</p>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
